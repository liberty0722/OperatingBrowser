<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Browser Controller</title>
    <style>
        :root {
            --bg: #0f0f14;
            --surface: #1a1a24;
            --surface2: #24243a;
            --border: #2e2e48;
            --text: #e4e4ef;
            --text-dim: #8888a8;
            --accent: #6c5ce7;
            --accent-hover: #7d6ff0;
            --success: #00d2a0;
            --danger: #ff5b5b;
            --warning: #ffc048;
            --radius: 12px;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            height: 100vh;
            overflow: hidden;
        }
        /* --- Layout --- */
        .app {
            display: grid;
            grid-template-columns: 1fr 380px;
            grid-template-rows: 56px 1fr;
            height: 100vh;
        }
        /* --- Header --- */
        .header {
            grid-column: 1 / -1;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
            background: var(--surface);
            border-bottom: 1px solid var(--border);
        }
        .header h1 {
            font-size: 18px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .header h1 span { color: var(--accent); }
        .header-actions { display: flex; gap: 8px; align-items: center; }
        .status-dot {
            width: 8px; height: 8px;
            border-radius: 50%;
            background: var(--danger);
            transition: background 0.3s;
        }
        .status-dot.active { background: var(--success); }
        .status-label { font-size: 13px; color: var(--text-dim); margin-right: 12px; }

        /* --- Buttons --- */
        .btn {
            padding: 8px 16px;
            border: none;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .btn-primary { background: var(--accent); color: #fff; }
        .btn-primary:hover { background: var(--accent-hover); }
        .btn-danger { background: var(--danger); color: #fff; }
        .btn-danger:hover { opacity: 0.85; }
        .btn-ghost {
            background: transparent;
            color: var(--text-dim);
            border: 1px solid var(--border);
        }
        .btn-ghost:hover { background: var(--surface2); color: var(--text); }
        .btn:disabled { opacity: 0.4; cursor: not-allowed; }
        .mode-btn { min-width: 180px; text-align: center; transition: all 0.2s; }
        .mode-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }

        /* --- Main content --- */
        .main {
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background: var(--bg);
        }
        .screenshot-area {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            min-height: 0;
        }
        .screenshot-area img {
            max-width: 100%;
            max-height: 100%;
            border-radius: var(--radius);
            border: 1px solid var(--border);
            object-fit: contain;
        }
        .screenshot-placeholder {
            color: var(--text-dim);
            font-size: 14px;
            text-align: center;
        }
        .screenshot-placeholder svg {
            width: 64px; height: 64px;
            margin-bottom: 12px;
            opacity: 0.3;
        }

        /* --- Sidebar --- */
        .sidebar {
            display: flex;
            flex-direction: column;
            background: var(--surface);
            border-left: 1px solid var(--border);
            overflow: hidden;
        }
        .sidebar-header {
            padding: 16px;
            border-bottom: 1px solid var(--border);
            font-weight: 600;
            font-size: 14px;
        }

        /* --- Chat / Log area --- */
        .log-area {
            flex: 1;
            overflow-y: auto;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .log-area::-webkit-scrollbar { width: 6px; }
        .log-area::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

        .log-item {
            padding: 10px 12px;
            border-radius: 8px;
            font-size: 13px;
            line-height: 1.5;
            animation: fadeIn 0.3s ease;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } }

        .log-action {
            background: var(--surface2);
            border-left: 3px solid var(--accent);
        }
        .log-action .action-name {
            color: var(--accent);
            font-weight: 600;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .log-action .action-params {
            color: var(--text-dim);
            font-size: 12px;
            margin-top: 4px;
            word-break: break-all;
        }
        .log-message {
            background: var(--surface2);
            border-left: 3px solid var(--success);
        }
        .log-error {
            background: #2a1a1a;
            border-left: 3px solid var(--danger);
            color: var(--danger);
        }
        .log-done {
            background: #1a2a20;
            border-left: 3px solid var(--success);
            color: var(--success);
            font-weight: 500;
        }

        /* --- Input area --- */
        .input-area {
            padding: 12px;
            border-top: 1px solid var(--border);
            display: flex;
            gap: 8px;
        }
        .input-area textarea {
            flex: 1;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 10px 12px;
            color: var(--text);
            font-size: 14px;
            resize: none;
            outline: none;
            font-family: inherit;
            min-height: 44px;
            max-height: 120px;
        }
        .input-area textarea:focus { border-color: var(--accent); }
        .input-area textarea::placeholder { color: var(--text-dim); }

        /* --- Settings Modal --- */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.6);
            z-index: 100;
            align-items: center;
            justify-content: center;
        }
        .modal-overlay.active { display: flex; }
        .modal {
            background: var(--surface);
            border-radius: var(--radius);
            border: 1px solid var(--border);
            padding: 24px;
            width: 460px;
            max-height: 80vh;
            overflow-y: auto;
        }
        .modal h2 { font-size: 16px; margin-bottom: 16px; }
        .form-group { margin-bottom: 14px; }
        .form-group label {
            display: block;
            font-size: 12px;
            color: var(--text-dim);
            margin-bottom: 4px;
            font-weight: 500;
        }
        .form-group input, .form-group select {
            width: 100%;
            padding: 8px 12px;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text);
            font-size: 14px;
            outline: none;
        }
        .form-group input:focus, .form-group select:focus { border-color: var(--accent); }
        .modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; }

        /* --- Thinking indicator --- */
        .thinking {
            display: none;
            padding: 10px 12px;
            font-size: 13px;
            color: var(--accent);
        }
        .thinking.active { display: flex; align-items: center; gap: 8px; }
        .thinking-dots span {
            width: 6px; height: 6px;
            border-radius: 50%;
            background: var(--accent);
            display: inline-block;
            animation: blink 1.4s infinite both;
        }
        .thinking-dots span:nth-child(2) { animation-delay: 0.2s; }
        .thinking-dots span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes blink {
            0%, 80%, 100% { opacity: 0.3; }
            40% { opacity: 1; }
        }
    </style>
</head>
<body>
    <div class="app">
        <!-- Header -->
        <header class="header">
            <h1>
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/>
                </svg>
                <span>AI</span> Browser Controller
            </h1>
            <div class="header-actions">
                <div class="status-dot" id="statusDot"></div>
                <span class="status-label" id="statusLabel">浏览器未启动</span>
                <button class="btn btn-primary" id="btnStartBrowser" onclick="startBrowser()">启动浏览器</button>
                <button class="btn btn-danger" id="btnStopBrowser" onclick="stopBrowser()" style="display:none">关闭浏览器</button>
                <button class="btn btn-ghost" onclick="refreshScreenshot()">📷 截图</button>
                <button class="btn btn-ghost" onclick="openSettings()">⚙️ 设置</button>
            </div>
        </header>

        <!-- Main: Screenshot viewer -->
        <div class="main">
            <div class="screenshot-area" id="screenshotArea">
                <div class="screenshot-placeholder" id="placeholderContent">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                        <rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/>
                    </svg>
                    <p style="font-size:16px;font-weight:600;margin-bottom:12px">选择连接模式</p>
                    <div style="display:flex;gap:12px;margin-bottom:16px;flex-wrap:wrap;justify-content:center">
                        <button class="btn btn-primary mode-btn active" id="modeReuse" onclick="selectMode('reuse')" style="padding:12px 20px">
                            🔗 复用已有浏览器<br><span style="font-size:11px;opacity:0.8">保留登录态和 Cookie</span>
                        </button>
                        <button class="btn btn-ghost mode-btn" id="modeStandalone" onclick="selectMode('standalone')" style="padding:12px 20px">
                            🆕 启动独立实例<br><span style="font-size:11px;opacity:0.8">空白 Profile，不影响已有浏览器</span>
                        </button>
                    </div>
                    <div id="reuseHint" style="background:var(--surface2);border-radius:8px;padding:12px 16px;text-align:left;font-size:13px;max-width:520px;margin:0 auto">
                        <p style="color:var(--warning);font-weight:600;margin-bottom:6px">📋 使用前请先开启 Chrome 远程调试：</p>
                        <p style="color:var(--text-dim);margin-bottom:8px">关闭所有 Chrome 窗口，然后用以下命令启动：</p>
                        <code id="launchCmd" style="display:block;background:var(--bg);padding:8px 12px;border-radius:6px;font-size:12px;word-break:break-all;cursor:pointer;border:1px solid var(--border)" onclick="copyLaunchCmd()" title="点击复制">加载中...</code>
                        <p style="color:var(--text-dim);font-size:11px;margin-top:6px">💡 点击命令可复制。启动后浏览器就和平时一样使用，AI 能直接操作你的页面。</p>
                    </div>
                    <div id="standaloneHint" style="display:none;color:var(--text-dim);font-size:13px;max-width:420px;margin:0 auto">
                        <p>将启动一个独立的 Chrome 窗口（空白配置）。</p>
                        <p style="margin-top:4px">不会影响你正在使用的浏览器，但需要重新登录网站。</p>
                    </div>
                    <button class="btn btn-primary" onclick="startBrowser()" style="margin-top:16px;padding:10px 32px;font-size:14px">
                        🚀 启动浏览器
                    </button>
                </div>
            </div>
        </div>

        <!-- Sidebar -->
        <div class="sidebar">
            <div class="sidebar-header">操作日志</div>
            <div class="log-area" id="logArea"></div>
            <div class="thinking" id="thinking">
                <div class="thinking-dots"><span></span><span></span><span></span></div>
                AI 正在思考...
            </div>
            <div class="input-area">
                <textarea id="taskInput" placeholder="输入指令，如「打开百度搜索 AI 新闻」" rows="1"
                    onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();submitTask()}"></textarea>
                <button class="btn btn-primary" id="btnSubmit" onclick="submitTask()">发送</button>
            </div>
        </div>
    </div>

    <!-- Settings Modal -->
    <div class="modal-overlay" id="settingsModal">
        <div class="modal">
            <h2>⚙️ 设置</h2>
            <div class="form-group">
                <label>API Key</label>
                <input type="password" id="cfgApiKey" placeholder="sk-...">
            </div>
            <div class="form-group">
                <label>API Base URL</label>
                <input type="text" id="cfgBaseUrl" placeholder="https://api.openai.com/v1">
            </div>
            <div class="form-group">
                <label>模型名称</label>
                <input type="text" id="cfgModel" placeholder="gpt-4o">
            </div>
            <div class="form-group">
                <label>浏览器连接模式</label>
                <select id="cfgBrowserMode">
                    <option value="reuse">复用已有浏览器（保留登录态）</option>
                    <option value="standalone">启动独立实例（空白 Profile）</option>
                    <option value="builtin">Playwright 内置 Chromium</option>
                </select>
            </div>
            <div class="form-group">
                <label>浏览器类型</label>
                <select id="cfgBrowserType">
                    <option value="chromium">Chromium</option>
                    <option value="firefox">Firefox</option>
                    <option value="webkit">WebKit</option>
                </select>
            </div>
            <div class="form-group">
                <label>
                    <input type="checkbox" id="cfgHeadless"> 无头模式（后台运行）
                </label>
            </div>
            <div class="modal-actions">
                <button class="btn btn-ghost" onclick="closeSettings()">取消</button>
                <button class="btn btn-primary" onclick="saveSettings()">保存</button>
            </div>
        </div>
    </div>

    <script>
        let eventSource = null;
        let selectedMode = 'reuse';  // 默认模式
        let launchCmdText = '';

        // --- Mode selection ---
        function selectMode(mode) {
            selectedMode = mode;
            document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
            const btnId = mode === 'reuse' ? 'modeReuse' : 'modeStandalone';
            const btn = document.getElementById(btnId);
            if (btn) {
                btn.classList.add('active');
                btn.className = btn.className.replace('btn-ghost', 'btn-primary');
            }
            // 另一个按钮恢复 ghost
            const otherId = mode === 'reuse' ? 'modeStandalone' : 'modeReuse';
            const otherBtn = document.getElementById(otherId);
            if (otherBtn) {
                otherBtn.className = otherBtn.className.replace('btn-primary', 'btn-ghost');
            }

            const reuseHint = document.getElementById('reuseHint');
            const standaloneHint = document.getElementById('standaloneHint');
            if (reuseHint) reuseHint.style.display = mode === 'reuse' ? '' : 'none';
            if (standaloneHint) standaloneHint.style.display = mode === 'standalone' ? '' : 'none';
        }

        function copyLaunchCmd() {
            if (!launchCmdText) return;
            navigator.clipboard.writeText(launchCmdText).then(() => {
                const el = document.getElementById('launchCmd');
                const orig = el.textContent;
                el.textContent = '✅ 已复制到剪贴板！';
                setTimeout(() => { el.textContent = orig; }, 1500);
            });
        }

        async function loadLaunchHint() {
            try {
                const res = await fetch('/api/browser/launch-hint');
                const data = await res.json();
                launchCmdText = data.launch_cmd;
                const el = document.getElementById('launchCmd');
                if (el) el.textContent = data.launch_cmd;
                // 同步后端默认模式
                if (data.browser_mode) {
                    selectedMode = data.browser_mode;
                    selectMode(selectedMode);
                }
            } catch (e) { /* ignore */ }
        }

        // --- SSE ---
        function connectSSE() {
            if (eventSource) eventSource.close();
            eventSource = new EventSource('/api/events');

            eventSource.addEventListener('step', e => {
                const data = JSON.parse(e.data);
                appendLog(data);
                if (data.action === 'screenshot' || data.type === 'done') {
                    refreshScreenshot();
                }
            });

            eventSource.addEventListener('task_complete', e => {
                const data = JSON.parse(e.data);
                appendLog({ type: 'done', summary: data.summary || '任务完成' });
                setThinking(false);
                refreshScreenshot();
            });

            eventSource.addEventListener('task_error', e => {
                const data = JSON.parse(e.data);
                appendLog({ type: 'error', content: data.error || '执行出错' });
                setThinking(false);
            });

            eventSource.addEventListener('browser', e => {
                const data = JSON.parse(e.data);
                if (data.status === 'error') {
                    appendLog({ type: 'error', content: data.message || '浏览器错误' });
                } else {
                    updateBrowserStatus(data.status === 'started');
                }
            });
        }

        // --- Log ---
        function appendLog(step) {
            const area = document.getElementById('logArea');
            const div = document.createElement('div');
            div.className = 'log-item';

            if (step.type === 'action') {
                div.className += ' log-action';
                const paramsStr = step.params ? JSON.stringify(step.params) : '';
                const resultStr = step.result?.error
                    ? `❌ ${step.result.error}`
                    : '✅';
                div.innerHTML = `<div class="action-name">${step.action}</div><div class="action-params">${escHtml(paramsStr)}</div><div style="margin-top:4px;font-size:12px">${resultStr}</div>`;
            } else if (step.type === 'done') {
                div.className += ' log-done';
                div.textContent = `✅ ${step.summary}`;
            } else if (step.type === 'error') {
                div.className += ' log-error';
                div.textContent = `❌ ${step.content}`;
            } else {
                div.className += ' log-message';
                div.textContent = step.content || JSON.stringify(step);
            }

            area.appendChild(div);
            area.scrollTop = area.scrollHeight;
        }

        function escHtml(s) {
            return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
        }

        // --- Browser control ---
        async function startBrowser() {
            const btn = document.getElementById('btnStartBrowser');
            btn.disabled = true;
            btn.textContent = '正在启动...';

            const modeLabels = {
                'reuse': '复用已有浏览器（保留登录态）',
                'standalone': '启动独立 Chrome 实例',
                'builtin': '使用内置 Chromium',
            };
            appendLog({ type: 'message', content: `🚀 正在以「${modeLabels[selectedMode] || selectedMode}」模式启动浏览器...` });

            try {
                const res = await fetch('/api/browser/start', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ browser_mode: selectedMode }),
                });
                const data = await res.json();
                if (data.success) {
                    updateBrowserStatus(true);
                    setTimeout(refreshScreenshot, 1000);
                    appendLog({ type: 'done', summary: '浏览器已连接，可以开始使用' });
                } else if (data.error) {
                    appendLog({ type: 'error', content: data.error });
                }
            } catch (e) {
                appendLog({ type: 'error', content: '启动浏览器失败: ' + e.message });
            }
            btn.disabled = false;
            btn.textContent = '启动浏览器';
        }

        async function stopBrowser() {
            await fetch('/api/browser/stop', { method: 'POST' });
            updateBrowserStatus(false);
            document.getElementById('screenshotArea').innerHTML = `
                <div class="screenshot-placeholder">
                    <p>浏览器已关闭</p>
                    <button class="btn btn-primary" onclick="location.reload()" style="margin-top:12px">刷新页面重新选择模式</button>
                </div>`;
        }

        function updateBrowserStatus(running) {
            document.getElementById('statusDot').className = 'status-dot' + (running ? ' active' : '');
            document.getElementById('statusLabel').textContent = running ? '浏览器运行中' : '浏览器未启动';
            document.getElementById('btnStartBrowser').style.display = running ? 'none' : '';
            document.getElementById('btnStopBrowser').style.display = running ? '' : 'none';
        }

        async function refreshScreenshot() {
            try {
                const res = await fetch('/api/browser/screenshot');
                const data = await res.json();
                if (data.base64) {
                    document.getElementById('screenshotArea').innerHTML =
                        `<img src="data:image/jpeg;base64,${data.base64}" alt="screenshot">`;
                }
            } catch (e) { /* ignore */ }
        }

        // --- Task ---
        async function ensureBrowserRunning() {
            try {
                const statusRes = await fetch('/api/status');
                const status = await statusRes.json();
                if (status.browser_running) {
                    updateBrowserStatus(true);
                    return true;
                }
            } catch (e) { /* ignore */ }

            appendLog({ type: 'message', content: '🚀 浏览器未启动，正在自动启动...' });
            try {
                const res = await fetch('/api/browser/start', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ browser_mode: selectedMode }),
                });
                const data = await res.json();
                if (data.success) {
                    updateBrowserStatus(true);
                    appendLog({ type: 'done', summary: '浏览器已自动启动' });
                    return true;
                }
                appendLog({ type: 'error', content: data.error || '自动启动浏览器失败' });
                return false;
            } catch (e) {
                appendLog({ type: 'error', content: '自动启动浏览器失败: ' + e.message });
                return false;
            }
        }

        async function submitTask() {
            const input = document.getElementById('taskInput');
            const task = input.value.trim();
            if (!task) return;

            input.value = '';
            appendLog({ type: 'message', content: `📋 任务: ${task}` });
            setThinking(true);

            const browserReady = await ensureBrowserRunning();
            if (!browserReady) {
                appendLog({ type: 'error', content: '浏览器未就绪，无法执行任务' });
                setThinking(false);
                return;
            }

            const res = await fetch('/api/task/run', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ task }),
            });
            const data = await res.json();
            if (data.error) {
                appendLog({ type: 'error', content: data.error });
                setThinking(false);
            }
        }

        function setThinking(on) {
            document.getElementById('thinking').className = 'thinking' + (on ? ' active' : '');
            document.getElementById('btnSubmit').disabled = on;
        }

        // --- Settings ---
        async function openSettings() {
            const res = await fetch('/api/config');
            const cfg = await res.json();
            document.getElementById('cfgApiKey').value = cfg.api_key === '***' ? '' : cfg.api_key;
            document.getElementById('cfgBaseUrl').value = cfg.base_url;
            document.getElementById('cfgModel').value = cfg.model;
            document.getElementById('cfgBrowserMode').value = cfg.browser_mode || 'reuse';
            document.getElementById('cfgBrowserType').value = cfg.browser_type;
            document.getElementById('cfgHeadless').checked = cfg.headless;
            document.getElementById('settingsModal').classList.add('active');
        }

        function closeSettings() {
            document.getElementById('settingsModal').classList.remove('active');
        }

        async function saveSettings() {
            const body = {
                base_url: document.getElementById('cfgBaseUrl').value,
                model: document.getElementById('cfgModel').value,
                browser_mode: document.getElementById('cfgBrowserMode').value,
                browser_type: document.getElementById('cfgBrowserType').value,
                headless: document.getElementById('cfgHeadless').checked,
            };
            const apiKey = document.getElementById('cfgApiKey').value;
            if (apiKey) body.api_key = apiKey;

            await fetch('/api/config', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body),
            });
            closeSettings();
            // 同步到首页模式选择
            selectedMode = body.browser_mode;
            selectMode(selectedMode);
        }

        // --- Init ---
        function checkAndSyncStatus() {
            fetch('/api/status').then(r => r.json()).then(s => {
                updateBrowserStatus(s.browser_running);
                if (s.browser_running) refreshScreenshot();
            }).catch(() => {});
        }

        connectSSE();
        checkAndSyncStatus();
        loadLaunchHint();
        document.addEventListener('visibilitychange', () => {
            if (!document.hidden) checkAndSyncStatus();
        });
    </script>
</body>
</html>
