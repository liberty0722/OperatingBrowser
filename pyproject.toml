[project]
name = "operating-browser"
version = "0.2.0"
description = "AI-powered browser and desktop automation tool"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "flask>=3.0",
    "flask-cors>=4.0",
    "playwright>=1.40",
    "openai>=1.10",
    "python-dotenv>=1.0",
    "Pillow>=10.0",
    "chardet>=7.4.3",
    "apscheduler>=3.10",
    "pyautogui>=0.9.54",
    "pywinauto>=0.6.8",
    "pynput>=1.7",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
