[project]
name = "operating-browser"
version = "0.1.0"
description = "AI-powered browser automation tool"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "flask>=3.0",
    "flask-cors>=4.0",
    "playwright>=1.40",
    "openai>=1.10",
    "python-dotenv>=1.0",
    "Pillow>=10.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
